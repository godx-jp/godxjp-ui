<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>visual-audit smoke fixture</title>
  </head>
  <body>
    <!--
      This fixture deliberately trips ALL FIVE runtime rule families so the CI smoke
      test (scripts/visual-audit-smoke.mjs) can assert every rule executed against a
      real Chromium + axe injection. Do NOT "fix" the intentional violations below.
    -->
    <main>
      <h1>Runtime audit fixture</h1>

      <!-- (1) axe-violations: an <img> with no alt text (WCAG 1.1.1 / axe image-alt). -->
      <img
        src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="
        width="120"
        height="60"
      />

      <!-- (3) oversaturated-accent: a full vivid blue (OKLCH chroma > 0.18). -->
      <button style="background: rgb(29, 78, 216); color: #fff; border: 0; padding: 8px 16px">
        Deploy
      </button>

      <!-- (2) target-size-min: a visible interactive target smaller than 24×24. -->
      <button
        aria-label="tiny"
        style="width: 16px; height: 16px; padding: 0; border: 0; background: #ddd"
      >
        x
      </button>

      <!-- (4) emoji-rendered: an emoji that survived into product text (UTS #51). -->
      <p>Deploy complete 🎉 all systems nominal.</p>

      <!-- (5) alert-controls-misplaced: 2 icons, full-width action, vertical stack. -->
      <div
        data-slot="alert"
        role="alert"
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          width: 480px;
          padding: 12px;
          background: #f5f5f5;
        "
      >
        <span>
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" /></svg>
          <svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" /></svg>
        </span>
        <span>Something needs your attention.</span>
        <button style="width: 100%; padding: 8px; border: 0; background: #ccc">Acknowledge</button>
      </div>

      <!-- (6) css-layers-missing: library class names with no library CSS loaded. -->
      <div class="ui-page-container"><div class="ui-dropdown-menu-content">menu</div></div>

      <!-- (7) control-height-mismatch: two controls in one row at different heights. -->
      <div class="ui-flex" data-direction="row" style="display: flex; gap: 8px">
        <button style="height: 32px">Save</button>
        <button style="height: 38px">Cancel</button>
      </div>

      <!-- (8) sibling-card-gap: two cards touching. -->
      <div>
        <div class="ui-card" style="height: 40px; border: 1px solid #ccc">card one</div>
        <div class="ui-card" style="height: 40px; border: 1px solid #ccc">card two</div>
      </div>

      <!-- (9) row-content-starved: a row text squeezed to a few pixels by its sibling. -->
      <div class="ui-flex" data-direction="row" style="display: flex; width: 400px">
        <span
          style="
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 24px;
            display: block;
          "
        >
          Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/537.36 Chrome/152 Safari/537.36
        </span>
        <div style="width: 376px; flex: none">sibling</div>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C02 clean: long translated hint visible in a label</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
      button { font: inherit; min-width: 32px; min-height: 32px; }

    </style>
  </head>
  <body>
    <label for="c02-labelled">Tìm trong tất cả các trang của bộ sưu tập</label>
    <input id="c02-labelled" role="searchbox" placeholder="Tìm trong tất cả các trang của bộ sưu tập" style="box-sizing: content-box; width: 10ch; padding: 4px; font: inherit" />
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C02 clean: named trigger opens a full field</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
      button { font: inherit; min-width: 32px; min-height: 32px; }

    </style>
  </head>
  <body>
    <button id="c02-trigger" data-audit-role="search-trigger" aria-label="Search">⌕</button>
    <div id="c02-panel" hidden><input id="c02-opened" role="searchbox" aria-label="Search" placeholder="Search" style="box-sizing: border-box; width: 100%; padding: 4px; font: inherit" /></div>
    <script>
      document.getElementById("c02-trigger").addEventListener("click", () => { document.getElementById("c02-panel").hidden = false; });
    </script>
  </body>
</html>

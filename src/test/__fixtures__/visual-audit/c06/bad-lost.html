<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C06 bad: overflow menu lost its actions</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
      button { font: inherit; min-width: 32px; min-height: 32px; }

    </style>
  </head>
  <body>
    <div id="c06-lgroup" class="ui-page-header-extra" style="display: flex; gap: 8px">
      <button>Cancel</button><button>Save</button>
      <button id="c06-empty" aria-haspopup="menu" aria-label="More">…</button>
    </div>
    <div id="c06-empty-menu" role="menu" hidden><p>Nothing here</p></div>
    <script>
      const t = document.getElementById("c06-empty");
      const m = document.getElementById("c06-empty-menu");
      t.addEventListener("click", () => { m.hidden = false; t.setAttribute("aria-expanded", "true"); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { m.hidden = true; t.setAttribute("aria-expanded", "false"); } });
    </script>
  </body>
</html>

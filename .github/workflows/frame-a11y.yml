name: Frame a11y & coverage

# Per-frame accessibility + preview-contract coverage gates (issues #157, #163).
#
#   • frame-coverage  — browser-free; every public component must have a frame, reports
#                       UNTESTED contract axes. Fast, runs on every PR.
#   • frame-axe       — real Chromium + axe over every /frame at desktop + mobile-sm.
#                       Preview-chrome violations are BLOCKING (0 allowed); component/demo
#                       violations are allowlisted against scripts/frame-axe.baseline.json,
#                       which may only shrink. Runs on every PR.
#   • frame-geometry  — heavier viewport-matrix sweep (8 widths), baseline-guarded. Runs on
#                       PRs too (was main/nightly only — regressions slipped in green, #179).
#   • verify          — build · typecheck · lint · ALL guard checks · test (= verify:static, the
#                       non-browser half of verify:release). PREVIOUSLY these ran ONLY at publish
#                       time, so a PR could merge with a broken guard / failing test / ungoverned
#                       prop type and only blow up on `npm publish` (TableProps, #179 → 18.0.1
#                       publish failure). Now a green PR is publish-ready.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: frame-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (build · typecheck · lint · guards · test)
    runs-on: [self-hosted, Linux, X64]
    # Port preview riêng mỗi job (self-hosted chung host) — xem frame-harness.mjs DEFAULT_BASE.
    env:
      PREVIEW_BASE: http://localhost:6008
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify:static includes check:visual-audit which renders in Chromium.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium
      - name: verify:static (all non-browser publish gates + test)
        run: pnpm verify:static

  coverage:
    name: Frame coverage (contract inventory)
    runs-on: [self-hosted, Linux, X64]
    env:
      PREVIEW_BASE: http://localhost:6018
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage report (report-only)
        run: pnpm check:frame-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-coverage
          path: |
            audit-evidence/frame-coverage/coverage.json
            docs/FRAME-COVERAGE-REPORT.md
          if-no-files-found: ignore

  axe:
    name: Per-frame axe (chrome blocking, component allowlisted)
    runs-on: [self-hosted, Linux, X64]
    env:
      PREVIEW_BASE: http://localhost:6028
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium
      - name: axe every frame (desktop + mobile-sm)
        run: pnpm check:frame-axe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-axe-evidence
          path: audit-evidence/frame-axe/
          if-no-files-found: ignore

  geometry:
    name: Viewport-matrix geometry sweep
    # Heavier (8 widths × every frame) but now gates PRs too — geometry regressions were
    # merging unseen because this only ran on main/nightly (#179 fixed 11 that had accumulated).
    runs-on: [self-hosted, Linux, X64]
    env:
      PREVIEW_BASE: http://localhost:6038
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install chromium
      - name: geometry sweep (320→1920)
        run: pnpm check:frame-geometry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-geometry-evidence
          path: audit-evidence/frame-geometry/
          if-no-files-found: ignore

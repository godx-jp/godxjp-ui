name: CI · release contract

# The @godxjp/ui <-> @godxjp/ui-mcp release contract (issue #140): the two packages may never
# ship at drifting versions, and the plan that publishes them must be executable.
#
# WHAT THIS NO LONGER DOES, AND WHY. It used to also run `pnpm build`,
# `check:packed-public-contract`, `check:mcp-lockstep`, `check:mcp-sync`, `check:mcp-orphans` and
# `check:mcp-pattern-imports` — all six of which `ci.yml`'s `verify:ci:static` already runs on the
# same commit. On a shared self-hosted pool that was the same work billed twice on every merge.
# What is left is what only this workflow does: build and test the MCP package, and prove the
# release command plan is executable against the post-bump manifests.
#
# Trigger matches CI's: merges to `main` only. The release itself fires on a tag.
on:
  push:
    branches: [main]

jobs:
  lockstep:
    runs-on: [self-hosted, swarm-pool]
    steps:
      - uses: actions/checkout@v6
      # Bootstrap Node BEFORE pnpm/action-setup. The swarm-pool hosts ship Node 18, and the pnpm
      # self-installer (npm 11) refuses to run there — it fails inside @pnpm/exe's setup.js with
      # `paths[0] must be of type string`, long before any repo code executes. `setup-node` after
      # `action-setup` is too late: the installer has already run.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install UI deps
        run: pnpm install --frozen-lockfile
      - name: Install MCP deps
        run: pnpm install --dir mcp

      # Build the exact public artifact first, then prove the packed subpath barrels contain the
      # runtime and declaration exports consumed by downstream applications. Packing only manifests
      # can pass while dist is absent or stale.
      - name: Build + test MCP
        run: pnpm --dir mcp build && pnpm --dir mcp test

      # 4) Pack both tarballs together and re-assert lockstep on the PACKED manifests — the artifacts
      #    that would actually ship must carry matching versions + compatibility pointers.
      - name: Pack artifacts and verify lockstep on the packed manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack && rm -f /tmp/pack/*.tgz
          npm pack --pack-destination /tmp/pack --ignore-scripts >/dev/null
          npm pack ./mcp --pack-destination /tmp/pack --ignore-scripts >/dev/null
          ls -1 /tmp/pack/*.tgz
          node -e '
            const {execSync}=require("node:child_process");
            const fs=require("node:fs");
            const read=(t,f)=>JSON.parse(execSync(`tar -xzO -f ${t} package/${f}`,{encoding:"utf8"}));
            const [ui]=fs.readdirSync("/tmp/pack").filter(f=>f.includes("godxjp-ui-")&&!f.includes("ui-mcp"));
            const [mcp]=fs.readdirSync("/tmp/pack").filter(f=>f.includes("ui-mcp"));
            const u=read(`/tmp/pack/${ui}`,"package.json");
            const m=read(`/tmp/pack/${mcp}`,"package.json");
            const errs=[];
            if(u.version!==m.version) errs.push(`packed version split: ui ${u.version} vs mcp ${m.version}`);
            if(u.godxUiMcp!==m.version) errs.push(`packed godxUiMcp ${u.godxUiMcp} != mcp ${m.version}`);
            if(errs.length){console.error("✗ packed artifacts drift:\n  "+errs.join("\n  "));process.exit(1);}
            console.log(`✓ packed artifacts in lockstep — @godxjp/ui@${u.version} ↔ @godxjp/ui-mcp@${m.version}`);
          '

      # 5) Step 4 only ever packs the PRE-bump manifests, so it cannot see the transition where the
      #    bug lived (issue #230): `npm version` + immediate `npm publish` shipping a UI tarball that
      #    still declared the previous godxUiMcp, with MCP failures found after the bytes were
      #    immutable. This plans the NEXT release for every bump kind and asserts, offline, that no
      #    publish precedes verify:release / MCP install+build+test / lockstep / npm auth, and that
      #    both POST-bump packed manifests already carry the coordinated target metadata.
      - name: Release command plan + post-bump packed manifests
        run: node scripts/check-release-command-plan.mjs

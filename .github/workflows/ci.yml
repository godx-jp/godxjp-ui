name: CI · code

# Browser-free validation, on the self-hosted `swarm-pool`.
#
# CI / CD SPLIT — visible from the workflow names, which all carry the side they belong to:
#   CI · code             this file        build, typecheck, lint, guards, the test suite
#   CI · browser          ci-browser.yml   axe, geometry, contrast/visual, rendered runtime
#   CI · release contract release-integrity.yml   @godxjp/ui <-> @godxjp/ui-mcp lockstep, every PR
#   CD · publish to npm   npm-publish.yml  manual, credential-gated, publishes both in lockstep
#   CD · deploy preview   preview-pages.yml the Pages deploy
# The files were always separate; only an earlier comment here pointed at a `cd.yml` that does
# not exist, which made the split look absent when it was merely mis-named.
#
# RUNNER — `[self-hosted, swarm-pool]`. Its image ships Node 22 and Playwright's Chromium, and
# `.github/actions/setup` asserts both rather than installing them — every job in every
# workflow here prepares itself through that one action, so the toolchain story lives there.
#
# WHY THIS IS TWO JOBS AND THE SUITE IS SHARDED
# `verify:ci` was one serial chain: build, then 28 guards, then the whole vitest suite. On a
# 4-core runner that is a single critical path with nothing overlapping. The guards do not
# need the tests and the tests do not need the guards, so they run side by side, and the
# suite is split across shards that run at the same time. The suite itself was also the
# larger problem: it ran with `fileParallelism: false`, one file at a time — see
# vitest.config.ts for the profile and the measurement.
# TRIGGER — merge to `main`, and nothing else.
#
# It used to be `pull_request` AND `push: [main]`. A PR merge fired both, so every merge paid for
# the same work twice on a shared self-hosted pool. `pull_request` is gone; the branch that lands
# on main is the branch CI judges.
on:
  push:
    branches: [main]
    # L6. Deliberately SHORT, and identical to ci-browser.yml and release-integrity.yml, so a
    # commit either triggers all three per-merge workflows or none of them — a partial set would
    # leave npm-publish.yml's provenance check with a gap it can only report as "never ran".
    # `**.md` is NOT ignored here: check:doc-prop-existence walks every docs/**/*.md, and
    # audit-evidence/** and artifacts/** are read by check:screen-reader-evidence and
    # check:display-runtime-evidence. Only genuinely inert paths are listed.
    paths-ignore:
      - "debate/**"
      - ".agent-notes/**"
      - ".design-sync/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  # cancel-in-progress is OFF for the push-to-main lanes, and that is a RELEASE requirement, not a
  # preference. `npm-publish.yml` fail-closes: it refuses to publish unless every check run it
  # delegates to concluded `success` on the EXACT SHA the tag points at. With cancel-in-progress on,
  # each new push to `main` cancelled the previous run, so three consecutive commits — 79aeb757,
  # a02768f0, dcafa96c — all ended with `Docs lane` / `CI · release contract` / `CI · browser`
  # green and `CI · code` CANCELLED, and 23.4.0 could not be tagged at all. Nothing was red: the
  # release was simply unreachable, which is the worst shape a gate can fail in.
  #
  # Cancelling stays ON in pr-lane.yml, where it is correct — pushing twice to a PR branch means
  # only the tip is worth judging, and nothing downstream depends on the older run.
  cancel-in-progress: false

jobs:
  static:
    name: Build · typecheck · lint · guards
    runs-on: [self-hosted, swarm-pool]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # verify:ci:static == verify:ci minus `pnpm test`, and verify:ci itself is verify:static
      # minus check:contrast / check:visual-audit — the only two gates that need Chromium, which
      # run in ci-browser.yml.
      #
      # DECLARED DEVIATION FROM CONTRACT.md L5, written here because this is where it happens.
      # Eight of these guards check that documentation and the MCP catalog still match the code —
      # check:mcp-sync, check:mcp-orphans, check:mcp-prop-sync, check:mcp-catalog-coverage,
      # check:mcp-pattern-imports, check:doc-prop-existence, check:audit-sync,
      # check:example-imports. L5 says such checks belong in a separate, non-blocking, paths-
      # filtered lane. They are staying here, and the reason is mechanical, not sentimental.
      #
      # The gate that matters in this repo is not branch protection — `main` has none (`gh api
      # repos/godx-jp/godxjp-ui/branches/main/protection` → 404, `/rulesets` → []). It is
      # `VerifyCommitProvenance` in npm-publish.yml, which refuses to publish unless every name in
      # scripts/release-core.mjs · REQUIRED_CI_CHECK_RUNS is green on the exact SHA. The entry
      # "verify:ci:static (…, ~25 guards)" maps to THIS job's check run, and that mapping is how
      # the release justifies not re-running `verify:release` itself. The mapping is a string: it
      # would keep passing whether or not these eight guards still run here. So moving them to a
      # paths-filtered docs lane does not make them optional — it makes the release's claim to
      # have verified them false, with nothing red to say so. That is Nguyên tắc 3's silent
      # failure, and the whole saving is a few seconds inside a 73s job (run 33976207784).
      #
      # MEASURED, so the deviation is a number and not a feeling. Each of the eight, run alone in
      # this tree: mcp-sync 0.18s, mcp-catalog-coverage 0.40s, mcp-orphans 0.18s,
      # mcp-pattern-imports 0.37s, mcp-prop-sync 0.18s, doc-prop-existence 0.19s, audit-sync 0.22s,
      # example-imports 0.44s — 2.16s for all eight. Moving them costs a second job: checkout +
      # `.github/actions/setup` + `pnpm install --frozen-lockfile`, which is the ~60-90s floor every
      # job here pays before it runs anything. So the "saving" is 2.16s against a new fixed cost an
      # order of magnitude larger, before the release-honesty problem above is even considered.
      #
      # The move becomes correct — and should then be made — once either the docs lane produces a
      # check run named in REQUIRED_CI_CHECK_RUNS with no `paths:` filter on its push trigger
      # (a filtered one would fail closed with "never ran" on any commit that misses the paths,
      # which is exactly the L6 trap), or npm-publish.yml stops delegating and runs verify:release
      # itself. Until one of those is true, the honest place for them is inside the check run that
      # the release already trusts. See .github/workflows/docs-lane.yml for the lane that does
      # exist, and what it deliberately does not carry.
      # THE GATE THAT GUARDS THE GATES lives in this chain: `check:gate-coverage`. It reads every
      # workflow in this directory, expands what they invoke through package.json, and fails if any
      # `check:*` is reachable from nothing — so adding a gate and forgetting to wire it is red HERE
      # rather than discovered by a consumer. `pnpm check:gate-coverage --report` prints the lane
      # each gate lands in. Measured 0.14s; the three gates it forced into this chain
      # (check:registry, check:no-antd-runtime) add 0.38s to a 73s job.
      #
      # IT DELIBERATELY DOES NOT AUDIT `verify:ci`. No workflow runs `verify:ci` — this job runs
      # verify:ci:static + check:frame-contracts, the suite runs below, and the Chromium gates run
      # in ci-browser.yml. An audit keyed on `verify:ci` membership reports gates that run on every
      # and gates that no runner executes as "wired". That mistaken audit is written down in an
      # earlier revision of scripts/guinea-pig-skill.md §5b; the corrected §5b explains why.
      #
      # WHERE THE 50 GATES RUN, as of this commit:
      #   this job              35  28 via verify:ci:static, 6 via check:frame-contracts,
      #                             plus check:frame-contracts itself as its own step
      #   ci-browser.yml         3  check:contrast + check:visual-audit (via verify:browser),
      #   ci-browser-full.yml    9  nightly / dispatch / `run-browser` label — the geometry sweep
      #                             and the rendered-runtime shards
      #   release-integrity.yml  1  check:release-plan (invoked as `node scripts/…`, not `pnpm`)
      #   declared manual        2  check:voiceover-capture, check:frame-runtime — see EXEMPT in
      #                             scripts/check-gate-coverage.mjs, which carries the reason for
      #                             each and fails if one of them silently becomes wired.
      # These counts are produced by `--report`; the guard fails if the mapping stops holding.
      - name: verify:ci:static (every browser-free publish gate)
        run: pnpm verify:ci:static

      # A HARD gate, and one of the release's own: `verify:release` is verify:static +
      # delegated to THIS job's check run by scripts/release-core.mjs · CI_PROOF_FOR_RELEASE_GATE.
      # The step chains seven real checks (check:component-api-manifest, audit:component-cases,
      # check:frame-coverage, check:frame-coverage-ledger, check:screen-reader-evidence,
      # check:data-entry-owner-source, check:display-runtime-evidence), so dropping it would not
      # save a report — it would empty seven release gates while the release still claims them.
      #
      # It also covers `check:frame-coverage` on its own: scripts/frame-coverage.mjs runs inside
      # this chain, which is why there is no separate report-only step for it. That script exits 0
      # without `--strict` (0.03s, 124 components); check:frame-coverage-ledger, one link later,
      # is where a real coverage regression is caught.
      - name: Static frame contracts
        run: pnpm check:frame-contracts

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: [self-hosted, swarm-pool]
    strategy:
      # Every shard runs to completion: one shard failing must not cancel the others, or a
      # single red file hides whatever the rest would have told you.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # No build step: the suite imports from `src`, not from `dist`. The `static` job owns the
      # build and every gate that reads the shipped artifact.
      # NO BARE `--` BEFORE THE FLAG, AND THAT IS A MEASUREMENT. It used to read
      # `pnpm test -- --shard=…`, which pnpm forwards VERBATIM: the child command became
      # `vitest run -- --shard=2/4`, vitest read the lone `--` as a positional filename filter and
      # ignored the flag entirely. Measured in this tree (vitest 4.1.11, pnpm 10.29.1):
      #   pnpm test -- --shard=2/4  ->  Test Files 484 passed (484)   107.8s
      #   pnpm test --shard=2/4     ->  Test Files 121 passed (121)    27.2s
      # So all FOUR shards were running the WHOLE suite — four identical full runs per merge,
      # green, with the job names still claiming a quarter each. Nguyên tắc 3's silent failure in
      # the cheapest possible form: two characters.
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # The @godxjp/ui <-> @godxjp/ui-mcp lockstep gates (`check:mcp-lockstep`, `check:mcp-sync`,
  # `check:mcp-orphans`, `check:mcp-pattern-imports`, `check:packed-public-contract`) run HERE,
  # inside `verify:ci:static`. `release-integrity.yml` used to run all five again on the same
  # commit; it now keeps only what nothing else does — building and testing the MCP package, and
  # proving the release command plan is executable against the post-bump manifests.

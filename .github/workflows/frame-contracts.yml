name: Frame contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frame-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:docs
      - run: pnpm preview:build
      - run: pnpm check:example-imports
      - run: pnpm check:frame-contracts

  rendered-runtime:
    name: rendered-runtime (${{ matrix.name }})
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: data-entry-core
            port: 6011
            stories: data-entry-input,data-entry-form-field-index,data-entry-form,data-entry-select,data-entry-checkbox,data-entry-radio-group,data-entry-switch,data-entry-slider,data-entry-toggle
            command: pnpm check:data-entry-frame-runtime
          - name: data-entry-pickers
            port: 6021
            stories: data-entry-date-picker,data-entry-month-picker,data-entry-time-picker,data-entry-color-picker,data-entry-upload,data-entry-cascader,data-entry-tree-select,data-entry-transfer,data-entry-number-input
            command: pnpm check:data-entry-frame-runtime
          - name: data-entry-specialized
            port: 6031
            stories: data-entry-search-input,data-entry-password-input,data-entry-input-otp,data-entry-rating,data-entry-tag-input,data-entry-calendar,data-entry-date-range-picker,data-entry-month-range-picker,data-entry-command
            command: pnpm check:data-entry-frame-runtime
          - name: interaction-semantics
            port: 6041
            stories: ""
            command: pnpm check:data-entry-touch-aria && pnpm check:layout-nav-frames && pnpm check:provider-feedback-query-runtime && pnpm check:data-table-pagination-wrap && pnpm check:button-icon-xs
          - name: layout-touch-rtl
            port: 6051
            stories: ""
            command: pnpm check:layout-nav-closure && pnpm check:final-touch-rtl
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: ${{ matrix.command }}
        env:
          DATA_ENTRY_STORIES: ${{ matrix.stories }}
          # Port preview riêng mỗi shard (self-hosted chung host) — check-data-entry-frame-runtime
          # đọc PREVIEW_PORT; các script khác giữ port riêng của chúng (không đụng nhau).
          PREVIEW_PORT: ${{ matrix.port }}

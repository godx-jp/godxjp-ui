name: CD · publish to npm

# PIPELINE: merge to `main` → CI. Push a `vX.Y.Z` tag → this workflow.
#
# The tag is the trigger AND the release's claim. A human bumps the version in an ordinary PR,
# it lands on main, CI judges that commit, and only then is `vX.Y.Z` pushed at it. This workflow
# publishes exactly that commit — it does not bump, does not commit and does not create a tag.
# Nothing here may move a public ref: a tag written before a publish that fails is a lie only a
# force-delete can correct, and this repo already learned from #266 what it costs to need delete
# rights on a registry it does not own.
#
# The script fail-closes on all three of these before the first byte is published:
#   • VerifyReleaseTag          the tag names the version package.json already carries, points at
#                               THIS commit, and that commit is an ancestor of origin/main
#   • VerifyCommitProvenance    every CI check run that verify:release delegates to concluded
#                               `success` on this exact SHA (or --full-verify re-ran them here)
#   • VerifyTargetOutranksLatest  the version is STRICTLY GREATER than the published `latest` for
#                               both packages, so promoting `latest` can never move it backwards
# Lockstep between @godxjp/ui and its pinned @godxjp/ui-mcp is enforced as before (issue #140),
# and again on every merge by release-integrity.yml.
#
# WHY THE SUITE IS NOT RE-RUN HERE. `verify:release` used to run in this job: the whole vitest
# suite plus the Chromium gates, on a commit CI had already proved green — roughly twenty minutes
# of duplicated work. It is not deleted, it is DELEGATED: `VerifyCommitProvenance` requires a
# green CI check run on the exact SHA for every gate verify:release would have run (the map lives
# in scripts/release-core.mjs · CI_PROOF_FOR_RELEASE_GATE), `VerifyPublishTree` proves the tree
# being packed is byte-identical to that commit, and `verify:publish-tree` still runs here for the
# one thing CI's verdict cannot cover — `dist/` is not in git, so it is built and re-checked
# against the bytes about to be packed. Set `full_verify` to fall back to the local re-run.
#
# One-time setup: a repo secret NPM_TOKEN (an npm "Automation" token with publish rights to the
# @godxjp scope).
on:
  push:
    tags: ["v*"]
  # Manual escape hatch: the legacy bump-and-commit release, and the --adopt-staged recovery for a
  # release that published but did not promote.
  workflow_dispatch:
    inputs:
      ui:
        description: "@godxjp/ui version bump (ignored when adopt_staged_version is set)"
        type: choice
        default: minor
        options: [patch, minor, major, skip]
      mcp:
        description: "@godxjp/ui-mcp (sync = adopt the ui version)"
        type: choice
        default: sync
        options: [sync, skip]
      adopt_staged_version:
        description: "Recover an exact already-published staging pair (x.y.z; blank for normal release)"
        type: string
        default: ""
      full_verify:
        description: "Re-run the whole verify:release locally instead of trusting CI's verdict on the commit"
        type: boolean
        default: false

permissions:
  contents: write # push the chore(release) commit back to main (workflow_dispatch path only)
  checks: read # read the CI check-run conclusions for the commit being published
  administration: read # read main's branch protection before the bump path publishes (gh#920)

jobs:
  publish:
    runs-on: [self-hosted, swarm-pool]
    steps:
      # fetch-depth: 0 — the release must prove the tagged commit is an ancestor of origin/main.
      # A shallow checkout cannot answer that, and "cannot answer" is refusal, not a pass.
      # `github.event_name == 'push'` is correct for the triggers this workflow declares: the tag
      # push, and workflow_dispatch. On the tag push `github.ref` is the tag being released; on a
      # dispatch there is no tag to publish, so the checkout falls back to `main`.
      #
      # IF THIS EVER MOVES TO `workflow_run`: `github.event_name` becomes `workflow_run` on every
      # run, this condition goes permanently false, and the release would silently check out `main`
      # instead of the tag — a wrong publish with nothing red to say so. The test would have to
      # become `github.event.workflow_run.event == 'push'`, and `github.ref` would have to be read
      # from `github.event.workflow_run.head_branch` / `head_sha`, since the workflow_run event
      # runs against the default branch, not against the ref that started it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
      - name: Fetch main (so the tag can be proven to be on main)
        run: git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
      # Node 22 and pnpm come from the runner image via the shared action (no setup-node — see
      # .github/actions/setup/action.yml). Only `full_verify` re-runs check:contrast /
      # prepared only on that path; the default path reads CI's verdict instead.
      - uses: ./.github/actions/setup
        with:
          chromium: ${{ inputs.full_verify && 'true' || 'false' }}

      # What setup-node's `registry-url` used to write: an .npmrc outside the shared HOME whose
      # token is read from NODE_AUTH_TOKEN at npm's run time. `npm whoami` / `npm publish` in
      # scripts/release.mjs authenticate through it.
      - name: npm auth for publish
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # gh#920. The dispatch bump path publishes and THEN pushes its release commit to `main`. When
      # branch protection requires a status check, that push can never succeed from here — `PR quick
      # check` only ever runs on a pull request, and GITHUB_TOKEN does not bypass protection the way
      # a repo admin does. 30.4.0 went out that way: both packages published and promoted, the push
      # rejected with GH006, and `main` left without the bump or the tag — so the NEXT release
      # computed its version from the stale one and aborted on `verify-target-outranks-latest`.
      # Refusing here costs a red run; discovering it after `npm publish` costs a manual reconcile
      # of a registry that has already moved. Only the dispatch bump path can be hurt: the tag path
      # publishes a commit that is already on main and writes nothing.
      - name: Refuse the bump path when its release commit could not be pushed (gh#920)
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.adopt_staged_version == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # FAIL CLOSED. A probe that cannot read the protection must refuse, not shrug: the token
          # may lack `administration: read`, and treating that as "no protection" would wave through
          # exactly the publish this step exists to stop.
          if ! contexts=$(gh api "repos/${{ github.repository }}/branches/main/protection" \
            --jq '[.required_status_checks.contexts // [] | .[]] | join(", ")'); then
            echo "✗ Refusing to bump-and-publish: could not read main's branch protection, so it is" >&2
            echo "  unknown whether the release commit could be pushed after publishing (gh#920)." >&2
            echo "  Grant this workflow 'administration: read', or use the tag path." >&2
            exit 1
          fi
          if [ -n "$contexts" ]; then
            echo "✗ Refusing to bump-and-publish: main requires status check(s) [$contexts]," >&2
            echo "  which a direct push from this workflow cannot satisfy, so the release commit" >&2
            echo "  would be rejected AFTER both packages were already published (gh#920)." >&2
            echo >&2
            echo "  Use the normal path instead: land the chore(release) commit on main through a" >&2
            echo "  PR, then push the tag — the tag trigger publishes that exact commit and writes" >&2
            echo "  nothing back." >&2
            exit 1
          fi
          echo "main takes a direct push from this workflow; the bump path may proceed."

      - name: Release (verify tag → verify CI green → publish → promote)
        run: |
          set -euo pipefail
          FULL=""
          if [ "${{ inputs.full_verify }}" = "true" ]; then FULL="--full-verify"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/release.mjs --tag "${{ github.ref_name }}" $FULL
          elif [ -n "${{ inputs.adopt_staged_version }}" ]; then
            node scripts/release.mjs --adopt-staged "${{ inputs.adopt_staged_version }}" --mcp sync $FULL
          else
            node scripts/release.mjs --ui "${{ inputs.ui }}" --mcp "${{ inputs.mcp }}" $FULL
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # `gh api` reads the commit's check runs
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Tag-triggered releases publish a commit that is ALREADY on main and write nothing, so there
      # is nothing to push. Only the manual bump-and-commit path produces a commit.
      - name: Push release commit
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: git push origin HEAD:main

name: Publish to npm

# Manual, credential-safe release. Reuses scripts/release.mjs (the single source of
# truth) so @godxjp/ui and its pinned @godxjp/ui-mcp publish in lockstep — the script
# refuses a ui-only bump and fail-closes on scripts/check-release-lockstep.mjs, so the two
# packages can never ship at drifting versions (issue #140). Drift is also caught earlier,
# on every PR, by the separate release-integrity.yml workflow.
#
# One-time setup: add a repo secret NPM_TOKEN (an npm "Automation" access token with
# publish rights to the @godxjp scope). Then run this workflow from the Actions tab.
# Keep the "mcp" input on `sync` for any release that bumps the UI.
on:
  workflow_dispatch:
    inputs:
      ui:
        description: "@godxjp/ui version bump"
        type: choice
        default: minor
        options: [patch, minor, major, skip]
      mcp:
        description: "@godxjp/ui-mcp (sync = adopt the ui version)"
        type: choice
        default: sync
        options: [sync, skip]

permissions:
  contents: write # push the chore(release) commit back to main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org # writes ~/.npmrc using NODE_AUTH_TOKEN
      - run: pnpm install --frozen-lockfile

      # verify:release runs check:contrast + check:visual-audit, which launch headless
      # Chromium via Playwright — the browser binary isn't in the runner image, so install it.
      - name: Install Playwright Chromium (for check:contrast + check:visual-audit)
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release (verify → version → publish → commit)
        run: node scripts/release.mjs --ui "${{ inputs.ui }}" --mcp "${{ inputs.mcp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release commit
        run: git push origin HEAD:main

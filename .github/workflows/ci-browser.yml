name: CI · browser

# The MANDATORY browser lane: the two Chromium gates that the release provenance names, and
# nothing else. CONTRACT.md L4 gives this lane a 5-minute budget and forbids parking a wide
# matrix in it.
#
#   • visual — check:contrast (20 routes) + check:visual-audit. 55–59s measured at 11 routes (runs
#              33974029465, 33976207776); the nine added routes are the Toast tone matrix (four
#              types × two themes) plus a dark theme that `/isolate/**` now actually applies, and
#              they cost +27s locally (12s → 39s for the contrast sweep alone). Still well inside
#              the budget.
#              violations are BLOCKING (0 allowed); component/demo violations are allowlisted
#
# oversight. This repo's real merge gate is not branch protection (main has none: `gh api
# repos/godx-jp/godxjp-ui/branches/main/protection` → 404, and `/rulesets` → []). It is
# `VerifyCommitProvenance` in npm-publish.yml, which fails CLOSED unless every name in
# scripts/release-core.mjs · REQUIRED_CI_CHECK_RUNS has a green check run on the exact SHA being
# component allowlisted)", and src/test/__tests__/release-workflow.test.ts asserts both names are
# it, or scoping it to changed frames) is the way out; relocating it is not.
#
# WHAT LEFT, AND WHERE IT WENT — ci-browser-full.yml (nightly / dispatch / `run-browser` label):
# the viewport-matrix geometry sweep and the five rendered-runtime shards. Measured 1958s of
# runner time across five shards on run 33976207776 (589 + 598 + 328 + 129 + 314), plus geometry
# (132s when it fast-failed, 1890s on the congested run 33972110874) — for six of this pool's
# eight browser slots, on every merge, on a fleet where geometry sat QUEUED for 35 minutes on run
# 33976207776 while the rest of the workflow finished. Neither gate is in REQUIRED_CI_CHECK_RUNS,
# so neither can be moved by mistake into blocking a release; both keep running, just not on the
# critical path of every merge.
#
# RUNNER — `[self-hosted, swarm-pool]`, prepared by `.github/actions/setup`. The runner image
# ships Node 22 and Playwright's Chromium at /opt/ms-playwright, so the action ASSERTS the
# toolchain and LAUNCHES the browser instead of downloading either. Verified still true on run
# 33974029465: no `setup-node`, no `Downloading Chrome`, and the whole setup action is 8–255s
# (the spread is node10's egress, not this workflow).
#
# Per-job preview ports stay distinct — self-hosted jobs can share a host, so two jobs binding
# the same port at once would collide.
#
# TRIGGER — merge to `main`, and nothing else. It used to be `pull_request` AND `push: [main]`;
# a PR merge fired both, so every merge paid for the same work twice on a shared self-hosted
# pool. The branch that lands on main is the branch CI judges.
on:
  push:
    branches: [main]
    # L6. Deliberately SHORT, and identical to ci.yml and release-integrity.yml, so a commit
    # either triggers all three per-merge workflows or none of them — a partial set would leave
    # the release provenance with a gap it can only report as "never ran". Everything omitted
    # here is a real gate INPUT: `**.md` is walked by check:doc-prop-existence, `audit-evidence/**`
    # by check:screen-reader-evidence, and `artifacts/**` by check:display-runtime-evidence.
    paths-ignore:
      - "debate/**"
      - ".agent-notes/**"
      - ".design-sync/**"
      - "LICENSE"

concurrency:
  # Per-COMMIT — see ci.yml for why a per-ref group cancels queued runs and strands releases.
  group: ci-browser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual:
    name: Contrast + visual audit
    runs-on: [self-hosted, swarm-pool]
    env:
      PREVIEW_BASE: http://localhost:6008
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm preview:build
      - run: pnpm verify:browser

  # ONE RULER, RUN WHERE THE CSS IS (gh#643). `scripts/visual-audit.mjs` holds eight rules; the
  # consumer's nightly runs axe with 68, and the other sixty — names, roles, aria-*, contrast,
  # target size — were checked nowhere in this repository. gh#639 is the bill: a topbar shipped,
  # every gate here said green, and `target-size` failed downstream in a repo that cannot fix CSS.
  #
  # SCOPED TO THE SHOWCASES, AND THAT IS A BUDGET DECISION MADE ON A MEASUREMENT, NOT A GUESS.
  # The full sweep — 215 routes × 3 viewports — runs 3m20s locally and I put it in this lane on
  # that number. On this pool's runner the same job measured 12m01s (run 34913… , job "Per-frame
  # axe (WCAG 2.2 AA)", 00:31:29 → 00:43:30): three times the local wall clock and more than twice
  # L4's five-minute budget for this whole lane. A gate that busts a documented budget on its first
  # merge is the "ma trận rộng" this file spends thirty lines telling people not to park here.
  #
  # So the merge lane runs `--scope=showcase`: the thirty whole-page frames, 30s locally. They are
  # the only frames here shaped like the screens a consumer ships — a landmark tree, a focus order,
  # real page reflow — and therefore the class gh#639 came from and the class the consumer's gate
  # has been carrying alone. The other 185 component frames sweep nightly in ci-browser-full.yml,
  # which is where this file's own header says a wide matrix belongs.
  #
  # `--shard=i/n` is in the script for the day the showcases outgrow this too; using it ADDS
  # check-run names, which is free here because none of them is in REQUIRED_CI_CHECK_RUNS.
  #
  # NOT a required check run. #492 removed the old "Per-frame axe" job from the release proof map
  # and this does not put it back — that is the owner's call to make separately. A red run still
  # refuses a publish through assertCiProvenance's collateral rule, which is the protection that
  # matters.
  frame-axe:
    name: Per-frame axe (showcases, WCAG 2.2 AA)
    runs-on: [self-hosted, swarm-pool]
    env:
      # A port of this job's OWN — self-hosted jobs share a host, and `visual` holds 6008.
      PREVIEW_BASE: http://localhost:6011
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm preview:build
      - run: pnpm check:frame-axe -- --scope=showcase
      # v7, the version every other upload in this repository uses. I wrote v4 and it failed the
      # lane with `Failed to FinalizeArtifact … (403) Forbidden` on a run whose gate had already
      # printed ✓ — a green measurement reported as a red merge, on the release commit itself.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frame-axe-results-showcase
          path: audit-evidence/frame-axe/
          if-no-files-found: ignore

  # Chia shard chứ không dời chỗ. Tên job nằm trong REQUIRED_CI_CHECK_RUNS, nên dời sang nightly
  # là mọi bản phát hành báo "never ran"; thu nhỏ chính gate mới là lối ra. Đo tại chỗ: một lượt
  # trọn bộ 164 khung mất 626 giây, ba shard đưa đường găng xuống khoảng 210 giây, dưới ngân sách
  # 5 phút. Đổi số shard là ĐỔI TÊN check run, nên phải sửa CI_PROOF_FOR_RELEASE_GATE trong
  # scripts/release-core.mjs và release-workflow.test.ts trong CÙNG một commit.

name: CI · browser

# The MANDATORY browser lane: the Chromium gates that run on every merge, and nothing else.
# CONTRACT.md L4 gives this lane a 5-minute budget and forbids parking a wide matrix in it.
#
#   • visual    — check:contrast (20 routes) + check:visual-audit. 55–59s measured at 11 routes
#                 (runs 33974029465, 33976207776); the nine added routes are the Toast tone matrix
#                 (four types × two themes) plus a dark theme that `/isolate/**` now actually
#                 applies, and they cost +27s locally (12s → 39s for the contrast sweep alone).
#                 Still well inside the budget.
#   • frame-axe — @axe-core/playwright over EVERY frame, 215 routes × 3 viewports, split across
#                 four shards so the critical path fits the budget. The arithmetic is on the job.
#
# ONLY `visual` IS NAMED BY THE RELEASE PROVENANCE, and the asymmetry is deliberate rather than an
# oversight. This repo's real merge gate is not branch protection (main has none: `gh api
# repos/godx-jp/godxjp-ui/branches/main/protection` → 404, and `/rulesets` → []). It is
# `VerifyCommitProvenance` in npm-publish.yml, which fails CLOSED unless every name in
# scripts/release-core.mjs · REQUIRED_CI_CHECK_RUNS has a green check run on the exact SHA being
# published. That list names "Contrast + visual audit"; it does NOT name the axe shards — #492
# took the old axe job out of the proof map and gh#643 did not put it back, for the reason written
# on the job below. A red shard still refuses a publish at that SHA through assertCiProvenance's
# `collateral` rule, so the protection that matters does not depend on the name being in the list.
#
# (The three orphan half-sentences that sat here until gh#643 item 3 were what #492 left behind
# when it deleted the axe job by deleting lines rather than rewriting the prose around them.)
#
# WHAT LEFT, AND WHERE IT WENT — ci-browser-full.yml (nightly / dispatch / `run-browser` label):
# the viewport-matrix geometry sweep and the five rendered-runtime shards. Measured 1958s of
# runner time across five shards on run 33976207776 (589 + 598 + 328 + 129 + 314), plus geometry
# (132s when it fast-failed, 1890s on the congested run 33972110874) — for six of this pool's
# eight browser slots, on every merge, on a fleet where geometry sat QUEUED for 35 minutes on run
# 33976207776 while the rest of the workflow finished. Neither gate is in REQUIRED_CI_CHECK_RUNS,
# so neither can be moved by mistake into blocking a release; both keep running, just not on the
# critical path of every merge.
#
# RUNNER — `[self-hosted, swarm-pool]`, prepared by `.github/actions/setup`. The runner image
# ships Node 22 and Playwright's Chromium at /opt/ms-playwright, so the action ASSERTS the
# toolchain and LAUNCHES the browser instead of downloading either. Verified still true on run
# 33974029465: no `setup-node`, no `Downloading Chrome`, and the whole setup action is 8–255s
# (the spread is node10's egress, not this workflow).
#
# Per-job preview ports stay distinct — self-hosted jobs can share a host, so two jobs binding
# the same port at once would collide.
#
# TRIGGER — merge to `main`, and nothing else. It used to be `pull_request` AND `push: [main]`;
# a PR merge fired both, so every merge paid for the same work twice on a shared self-hosted
# pool. The branch that lands on main is the branch CI judges.
on:
  push:
    branches: [main]
    # L6. Deliberately SHORT, and identical to ci.yml and release-integrity.yml, so a commit
    # either triggers all three per-merge workflows or none of them — a partial set would leave
    # the release provenance with a gap it can only report as "never ran". Everything omitted
    # here is a real gate INPUT: `**.md` is walked by check:doc-prop-existence, `audit-evidence/**`
    # by check:screen-reader-evidence, and `artifacts/**` by check:display-runtime-evidence.
    paths-ignore:
      - "debate/**"
      - ".agent-notes/**"
      - ".design-sync/**"
      - "LICENSE"

concurrency:
  # Per-COMMIT — see ci.yml for why a per-ref group cancels queued runs and strands releases.
  group: ci-browser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual:
    name: Contrast + visual audit
    runs-on: [self-hosted, swarm-pool]
    env:
      PREVIEW_BASE: http://localhost:6008
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm preview:build
      - run: pnpm verify:browser

  # ONE RULER, RUN WHERE THE CSS IS (gh#643). `scripts/visual-audit.mjs` holds eight rules; the
  # consumer's nightly runs axe with 68, and the other sixty — names, roles, aria-*, contrast,
  # target size — were checked nowhere in this repository. gh#639 is the bill: a topbar shipped,
  # every gate here said green, and `target-size` failed downstream in a repo that cannot fix CSS.
  #
  # SHARD, DO NOT RELOCATE — and FOUR is a number off a measurement, not a preference.
  # #645 scoped this lane to `--scope=showcase` (30 frames) and sent the other 185 to the nightly,
  # which left a component-frame regression caught at 02:00 instead of at merge — weaker than the
  # "fails at PR time, in the repository that can fix it" gh#643 asked for, and the runner's clock
  # rather than a design choice. Sharding buys it back. Two runner measurements fix the model:
  #
  #     full sweep, 215 routes × 3 viewports   721s  (12m01s, job "Per-frame axe (WCAG 2.2 AA)")
  #     showcase scope, 30 routes              170s  (2m50s)
  #
  # ⇒ marginal cost k = (721 − 170) / 185 = 2.98s per route, and the fixed per-job cost (checkout
  # + setup + `pnpm preview:build`) is O = 170 − 30k ≈ 81s. A shard's wall clock is therefore
  # O + (721 − O)/N — and it does not matter WHICH routes land in a shard, because `shardOf` is a
  # round robin over the SORTED route list, so every shard gets the same mix of the slower
  # `/showcase/**` and the faster `/isolate/**`:
  #
  #     N=2  →  403s  (6m43s)  over L4's 300s
  #     N=3  →  296s  (4m56s)  inside it by four seconds, which is not margin on a pool whose own
  #                             setup action varies 8–255s
  #     N=4  →  242s  (4m02s)  19% under budget                                      ← CHOSEN
  #
  # THE MODEL WAS RIGHT ABOUT THE SWEEP AND WRONG ABOUT THE LANE. First merge that ran it
  # (35047347097), per shard: setup 15 / 314 / 40 / 37s, sweep 85 / 141 / 155 / 150s. The SWEEP
  # half is what the arithmetic predicted and the round robin does equalise it — a 70s spread
  # across four shards, every one of them inside the budget on its own. The LANE still took 474s,
  # because one job's `.github/actions/setup` drew 314s while its three siblings drew 15–40s.
  #
  # That is this file's own documented variance ("8–255s … node10's egress"), and 314s is past the
  # top of it. The consequence for sharding is the part worth writing down: a lane's wall clock is
  # max over N DRAWS from that distribution, so splitting one job into four does not divide the
  # fixed cost — it takes four samples from a long tail instead of one. Sharding cannot fix that
  # and slightly worsens it.
  #
  # Kept at four anyway, deliberately: the thing gh#643 item 3 asked for — a component-frame
  # regression caught at merge instead of at 02:00 — is delivered, and the gate's own cost fits.
  # The budget risk that remains is the setup action's egress, which is neither caused by this job
  # nor fixable inside it. Do NOT re-tune N against a bad setup draw; measure the `sweep` step.
  #     N=5  →  209s  (3m29s)  faster, but see the slot cost
  #
  # Measured locally to prove the partition rather than trust it: `--shard=1/3` selected 72 of the
  # 215 routes (215/3 → 72 + 72 + 71, every route in exactly one shard) and ran in 45s against the
  # STATIC preview. The dev server is not a substitute — it produces 1–3 spurious
  # `route-did-not-render` rows from `page.goto` timeouts.
  #
  # WHAT IT COSTS, SAID PLAINLY: four of this pool's eight browser slots for ~4 minutes on every
  # merge, where the showcase job took one. With `visual` that is five jobs at once, and
  # ci-browser-full.yml records five CONCURRENT preview servers on one physical host as the
  # configuration that failed to bind (hence its `max-parallel: 2`). The difference is weight and
  # duration: those shards each held a preview for 589/598/328/129/314s while driving the
  # interactive runtime gates, while these hold one for ~3 minutes to serve static files, and
  # `visual` is a ~1-minute job that is gone before the shards are half done. If a bind failure
  # does show up anyway, `max-parallel: 3` is the lever and it is paid for out of the budget —
  # N=5 three-at-a-time, not a retreat to the nightly.
  #
  # Ports are this job's own, one per shard. `visual` holds 6008 and ci-browser-full.yml holds
  # 6011, 6021, 6031, 6038, 6039 and 6041 — that lane CAN run at the same time as this one (a
  # `run-browser` label, or a dispatch during a merge), so 6012–6015 collide with neither.
  #
  # TWO RULES `scripts/check-frame-axe.mjs` MUST KEEP UNDER `--shard`, both learned in b367b832:
  #   (a) the "baselined entry no longer fires" report may run ONLY on a full sweep — one shard
  #       cannot see another shard's frames, so under a shard every other shard's rows read as
  #       fixed and following the advice to `--update` would delete them;
  #   (b) `--update` must REFUSE under `--shard` — a shard would rewrite the ledger from its own
  #       slice. This lane never passes `--update`, so the workflow is safe either way; the rules
  #       are what protects a person running the same flags by hand.
  #
  # CHANGING THE SHARD COUNT RENAMES THE CHECK RUNS — Đổi số shard là ĐỔI TÊN check run. These
  # names are not in scripts/release-core.mjs · CI_PROOF_FOR_RELEASE_GATE today; the day they are,
  # that file and src/test/__tests__/release-workflow.test.ts must be edited in the SAME commit as
  # this matrix, or every release refuses with "never ran: Per-frame axe (shard 1/4)".
  #
  # AND THEY ARE DELIBERATELY NOT IN IT. CI_PROOF_FOR_RELEASE_GATE is the map of gates
  # `verify:release` WOULD have run → the check run that stands in for them, and `check:frame-axe`
  # is not in `verify:release`; a gate absent from the left column has no business in the right.
  # #492 took the old name out of that map and gh#643's reporter called putting it back "the
  # owner's call, not a side effect of this". A red shard still refuses a publish at the same SHA
  # through assertCiProvenance's `collateral` rule, which is the protection that matters.
  frame-axe:
    name: Per-frame axe (shard ${{ matrix.shard }}/4)
    runs-on: [self-hosted, swarm-pool]
    strategy:
      # Every shard runs to the end. One red shard must not cancel the other three — a CANCELLED
      # check run is indistinguishable from one that never ran, and that is the failure mode the
      # whole release-provenance mechanism is built to refuse.
      fail-fast: false
      matrix:
        include:
          - shard: 1
            port: 6012
          - shard: 2
            port: 6013
          - shard: 3
            port: 6014
          - shard: 4
            port: 6015
    env:
      PREVIEW_BASE: http://localhost:${{ matrix.port }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: pnpm preview:build
      # Spelled out in full, not hidden behind a shell variable: check:gate-coverage reads these
      # workflows for a literal `pnpm check:<name>` and a variable would read as a DEAD GATE.
      - run: pnpm check:frame-axe -- --shard=${{ matrix.shard }}/4
      # v7, the version every other upload in this repository uses. I wrote v4 and it failed the
      # lane with `Failed to FinalizeArtifact … (403) Forbidden` on a run whose gate had already
      # printed ✓ — a green measurement reported as a red merge, on the release commit itself.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # One name per shard: four jobs uploading one name is a collision, not a merge.
          name: frame-axe-results-shard-${{ matrix.shard }}
          path: audit-evidence/frame-axe/
          if-no-files-found: ignore

name: Docs lane

# CONTRACT.md L5's separate lane for things that are not product code: it does NOT gate merge,
# and it only runs when documentation or a workflow file actually changed.
#
# WHY THIS IS A LOCAL COPY AND NOT `uses: godx-jp/ci-platform/.github/workflows/docs-lane.yml@v1`.
# That reusable workflow is the org's canonical version and this file is deliberately modelled on
# it — but `godx-jp/ci-platform` is a PRIVATE repository whose Actions access level is `none`
# (`gh api repos/godx-jp/ci-platform/actions/permissions/access` → {"access_level":"none"}), while
# `godx-jp/godxjp-ui` is PUBLIC. A `uses:` pointing there resolves to nothing and the workflow
# fails at startup. Granting that access is a change to ci-platform's settings, not to this repo,
# so it is left to whoever owns it; switch this file to the one-line `uses:` the moment
# access_level is opened up, and delete the steps below.
#
# WHAT IS NOT HERE, AND WHY — the eight "docs/catalog matches code" guards (check:mcp-sync,
# check:mcp-orphans, check:mcp-prop-sync, check:mcp-catalog-coverage, check:mcp-pattern-imports,
# check:doc-prop-existence, check:audit-sync, check:example-imports) are the obvious candidates
# for this lane and they are STILL in `verify:ci:static`. That is a declared deviation from L5,
# not an oversight; the reason is written at the point of violation, in ci.yml above the
# `verify:ci:static` step. Short version: this repo's real gate is npm-publish.yml's fail-closed
# provenance check, which trusts the check run named "Build · typecheck · lint · guards" to stand
# for every gate `verify:release` would have run. Quietly emptying that job of eight of those
# gates would leave the claim intact and the proof gone — Nguyên tắc 3's silent failure, bought
# for a few seconds of a 73s job.
on:
  # The two path lists are spelled out twice on purpose: GitHub Actions does not support YAML
  # anchors, and a workflow that uses them is rejected at parse time.
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**'

concurrency:
  group: docs-lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs lane (does not gate merge)
    runs-on: [self-hosted, swarm-pool]
    steps:
      - uses: actions/checkout@v6

      # THERE IS NO "workflow YAML parses" STEP HERE, AND THAT IS A MEASUREMENT, NOT AN OVERSIGHT.
      # The first version of this lane ran `python3 -c "import yaml; yaml.safe_load(...)"` over
      # .github/workflows/*.yml — the same step the org's reusable docs-lane.yml runs. On this
      # fleet it fails: `tempo-runner-php:noble` ships python3 WITHOUT PyYAML, so every file
      # reported `ModuleNotFoundError: No module named 'yaml'` under an error message claiming the
      # YAML did not parse (run 33978603578). A check that cannot tell "the parser is missing"
      # from "the file is broken" is worse than no check — it is Nguyên tắc 3 inverted, a gate
      # that names the wrong cause with total confidence.
      #
      # The fix is not to install PyYAML at job time (L8) nor to add a YAML parser to
      # package.json for a lane that does not gate anything. Workflow-YAML validation belongs in
      # L4's LOCAL lane, where actionlint and a Python with PyYAML are already on the developer's
      # machine and the answer arrives before the push instead of after it. Note for whoever owns
      # godx-jp/ci-platform: the reusable docs-lane.yml carries this same step and will fail the
      # same way on any repo on this fleet that adopts it.

      # INTERNAL links only. Checking outbound links in CI is a third-party red — exactly what
      # L5 keeps off the road to merge. Warnings, never a failure: a dead link is worth seeing,
      # not worth stopping anyone for.
      # WARNINGS ONLY, NEVER RED — and making that true took two runs, which is the point of
      # writing it down. GitHub invokes this step as `bash -e`, and `grep` exits 1 when a file
      # simply contains no links, so the first .md without one aborted the whole step with a bare
      # "exit code 1" and no output at all (runs 33978603578, 33978676011). `set +e` plus the
      # closing `exit 0` is what actually makes "does not gate merge" true rather than merely
      # claimed. The org's reusable docs-lane.yml carries the same `set -euo pipefail` over the
      # same pipeline and will abort the same way.
      - name: Internal links resolve
        run: |
          set -u
          set +e
          while IFS= read -r md; do
            base=$(dirname "$md")
            grep -oE '\]\([^)#][^)]*\)' "$md" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:|//|\$)' \
              | grep -vE ':[0-9]+$' \
              | while IFS= read -r target; do
                  [ -z "$target" ] && continue
                  if [ ! -e "$base/$target" ] && [ ! -e "$target" ]; then
                    echo "::warning file=$md::broken internal link -> $target"
                  fi
                done
          done < <(find . -name '*.md' \
                     -not -path './node_modules/*' \
                     -not -path './.git/*' \
                     -not -path './debate/*')
          # TWO EXCLUSIONS, BOTH MEASURED. Unfiltered, this printed 100+ warnings and the two
          # real ones were invisible inside them — an alert nobody can read is the attention
          # budget L5 is actually about. `debate/**` is agent debate transcripts, not shipped
          # documentation, and `…:123` is a source-line citation, not a link. With both applied
          # the output is two genuine dead links (CHANGELOG.md → docs/MIGRATION-v19.md and
          # docs/FRAME-A11Y-CI.md → ./roadmap/color-extensibility.md), left for their owners.
          #
          # A stale link is worth seeing, not worth stopping anyone for (L5).
          exit 0

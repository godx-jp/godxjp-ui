name: CD · deploy preview to Pages

# TRIGGER — a tag. Deployment is part of a release, not of every merge.
#
# It used to fire on every push to `main`, which meant a full `preview:build` per merge on a
# shared self-hosted pool, publishing a Pages site nobody had asked for yet. The pipeline is now:
# merge to `main` runs CI; creating a `v*` tag runs release and deploy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, swarm-pool]
    steps:
      - uses: actions/checkout@v6
      # Node 22 and pnpm come from the runner image via the shared action (no setup-node — see
      # .github/actions/setup/action.yml).
      - uses: ./.github/actions/setup
      - name: Build preview (project-page base)
        run: pnpm preview:build
        env:
          PREVIEW_BASE: /godxjp-ui/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: [self-hosted, swarm-pool]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

name: CD · deploy preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, swarm-pool]
    steps:
      - uses: actions/checkout@v6
      # Bootstrap Node BEFORE pnpm/action-setup. The swarm-pool hosts ship Node 18, and the pnpm
      # self-installer (npm 11) refuses to run there — it fails inside @pnpm/exe's setup.js with
      # `paths[0] must be of type string`, long before any repo code executes. `setup-node` after
      # `action-setup` is too late: the installer has already run.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build preview (project-page base)
        run: pnpm preview:build
        env:
          PREVIEW_BASE: /godxjp-ui/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: preview/dist

  deploy:
    needs: build
    runs-on: [self-hosted, swarm-pool]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

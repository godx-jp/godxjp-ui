name: CI · browser (full sweep)

# The SLOW lane of CONTRACT.md L4. It does NOT gate merge and it does NOT run on every push.
#
# WHAT IS HERE, AND WHY IT LEFT ci-browser.yml
#   • geometry         — viewport-matrix sweep, 8 widths (320→1920), baseline-guarded.
#   • token-wins       — CDP cascade sweep for component tokens the browser throws away.
#   • token-scope      — the neighbouring defect: tokens declared where the scope that needs them
#                        cannot reach (frozen at :root, or declared under an unreachable selector).
#   • control-glyph-tier — glyphs inside control-sized boxes that nothing in CSS ever sized, so
#                        they ship at their source library's `width="24"` (gh#820/#841/#845).
#   • rendered-runtime — five shards of per-frame data-entry / layout / provider runtime contracts.
#
# Measured on run 33976207776 (a normal, uncongested merge): the five rendered-runtime shards cost
# 589 + 598 + 328 + 129 + 314 = 1958s of runner time and took five of the pool's eight browser
# slots, while `geometry` was STILL QUEUED 35 minutes after the push and only finished after the
# rest of the workflow was done. On the congested run 33972110874 the same six jobs cost 6155s.
# That is L4's "ma trận rộng" — a wide matrix — sitting on the critical path of every merge, on a
# pool that is shared with tempo, kintai and godx-chat.
#
# WHY THIS MOVE IS SAFE FOR THE RELEASE. npm-publish.yml fails closed unless every name in
# scripts/release-core.mjs · REQUIRED_CI_CHECK_RUNS is green on the exact SHA. Neither `geometry`
# nor any `rendered-runtime` shard is in that list — only "Build · typecheck · lint · guards", the
# four test shards, "Contrast + visual audit" and "lockstep" are. So moving these two out of the
# per-merge lane cannot make a release ship something unverified; it removes work that was never
# part of the release's proof to begin with.
#
# NO AXE HERE EITHER. `check:frame-axe` is local-only by the owner's standing rule (2026-09-17);
# the nightly full sweep that lived in this file is removed with the merge-lane shards. See
# ci-browser.yml's header.
#
# It does, however, still protect the release in the other direction: assertCiProvenance also
# refuses on ANY OTHER red check run on the SHA being published (the `collateral` rule). A red
# nightly sweep on main's HEAD therefore blocks a tag cut at that same commit — which is the
# behaviour we want, and the reason this lane is worth keeping green rather than ignoring.
#
# THREE WAYS TO RUN IT
#   1. schedule       — nightly at 02:00 JST (17:00 UTC), on main.
#   2. workflow_dispatch — on demand, any ref.
#   3. `run-browser` label on a PR — the author opts in when a change plausibly moves geometry or
#      runtime contracts, per L4 ("theo nhãn khi người viết chủ động muốn"). `types: [labeled]`
#      fires for EVERY label, so each job re-checks the label set in `if:`; without that guard an
#      unrelated label would launch a 30-minute sweep.
#
# THE FORK GUARD IN THAT SAME `if:` — `head.repo.full_name == github.repository`, the same line
# pr-lane.yml carries. This repository is PUBLIC and `swarm-pool` is a long-lived self-hosted pool
# shared with tempo, kintai and godx-chat. `pull_request` checks out the FORK's head, so without
# the guard a fork's own code — including its edit to this very file — would run on that pool.
# The label is not a substitute: it only means a maintainer pressed a button, and the code that
# then runs is still the fork's. Lower odds than an unlabelled lane, identical exposure.
#
# No `paths:` filter (L6): all three triggers are already explicit statements of intent — a
# schedule, a human pressing the button, or a human attaching the label. There is nothing to
# filter that the trigger has not already decided.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  # Per-COMMIT — see ci.yml for why a per-ref group cancels queued runs and strands releases.
  group: ci-browser-full-${{ github.sha }}
  cancel-in-progress: false

jobs:
  geometry:
    name: Viewport-matrix geometry sweep
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-browser'))
    runs-on: [self-hosted, swarm-pool]
    env:
      PREVIEW_BASE: http://localhost:6038
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: geometry sweep (320→1920)
        run: pnpm check:frame-geometry
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frame-geometry-evidence
          path: audit-evidence/frame-geometry/
          if-no-files-found: ignore

  token-wins:
    name: Inert component tokens (CDP cascade sweep)
    # NOT in ci-browser.yml. That lane has a 5-minute budget (CONTRACT.md L4) and already spends
    # most of it; this sweep costs ~10 minutes because `CSS.getMatchedStylesForNode` is ~60ms and
    # ~930KB per element and cannot be pipelined, and it asks about ~5,300 elements across the 192
    # frames. It is baseline-guarded, so what it protects against is a NEW inert token appearing —
    # a thing that arrives with a commit, not with a minute, and a nightly catch is soon enough.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-browser'))
    runs-on: [self-hosted, swarm-pool]
    env:
      PREVIEW_BASE: http://localhost:6048
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: inert component tokens
        run: pnpm check:frame-token-wins

  token-scope:
    name: Unreachable tokens (scope + freeze sweep)
    # HERE AND NOT ci-browser.yml, for the same arithmetic that put `token-wins` here. Its REACH
    # stage visits every element matching a bare `var()` reader on all 192 frames, and the cost is
    # the 192 navigations, ~10 minutes — over the merge lane's whole 5-minute budget (CONTRACT.md
    # L4) on its own. It is baseline-guarded, so what it protects against is a NEW unreachable
    # token arriving with a commit, and a nightly catch is soon enough for that.
    #
    # A SEPARATE JOB FROM token-wins, not a second step in it: the two gates share only the preview
    # server, and sharing one job would serialise ~20 minutes behind a single runner slot on a pool
    # four projects contend for. Own port, so the two previews cannot collide.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-browser'))
    runs-on: [self-hosted, swarm-pool]
    env:
      PREVIEW_BASE: http://localhost:6058
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: unreachable + frozen tokens
        run: pnpm check:frame-token-scope

  control-glyph-tier:
    name: Unsized control glyphs (icon-tier sweep)
    # HERE AND NOT ci-browser.yml, on the same arithmetic as `token-wins` and `token-scope`. The
    # sweep is 231 navigations — 199 `/isolate/**` frames plus the 32 standalone showcases, which
    # it takes because gh#845 was REPORTED from /showcase/case4-login and the `.ui-control-trigger`
    # half of that defect appears on no contract frame at all. Measured 2m55s locally; ci-browser.yml
    # has a 5-minute budget (CONTRACT.md L4) that `verify:browser` already spends.
    #
    # It carries NO baseline and gates at 0: every finding has the same one-line fix (size the
    # glyph from the icon tier), and the numbers are integers out of a style sheet rather than font
    # rasterisation, so unlike check:frame-overflow it cannot report a known finding as new on a
    # different renderer.
    #
    # Nightly is soon enough for what it protects against — a NEW unsized glyph arrives with a
    # commit, not with a minute — and this lane still guards the release: a red run on main's HEAD
    # blocks a tag cut at that SHA through npm-publish.yml's `collateral` rule.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-browser'))
    runs-on: [self-hosted, swarm-pool]
    env:
      # Own port, for the reason token-scope's note gives: self-hosted jobs share a host and two
      # previews on one port collide.
      PREVIEW_BASE: http://localhost:6068
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - name: unsized control glyphs
        run: pnpm check:control-glyph-tier

  rendered-runtime:
    name: rendered-runtime (${{ matrix.name }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-browser'))
    runs-on: [self-hosted, swarm-pool]
    strategy:
      fail-fast: false
      # Two at a time, not five. These runners share one physical host, so five shards each
      # building a preview and standing up a `vite preview` is oversubscription, and it showed up
      # as the preview server failing to bind rather than as anything that names the real cause.
      max-parallel: 2
      matrix:
        include:
          - name: data-entry-core
            port: 6011
            stories: data-entry-input,data-entry-form-field-index,data-entry-form,data-entry-select,data-entry-checkbox,data-entry-radio-group,data-entry-switch,data-entry-slider,data-entry-toggle
            command: pnpm check:data-entry-frame-runtime
          - name: data-entry-pickers
            port: 6021
            stories: data-entry-date-picker,data-entry-time-picker,data-entry-cascader,data-entry-tree-select,data-entry-transfer,data-entry-color-picker,data-entry-number-input,data-entry-upload
            command: pnpm check:data-entry-frame-runtime
          - name: data-entry-specialized
            port: 6031
            stories: data-entry-search-input,data-entry-password-input,data-entry-input-otp,data-entry-rating,data-entry-tag-input,data-entry-calendar,data-entry-command
            command: pnpm check:data-entry-frame-runtime
          - name: interaction-semantics
            port: 6041
            stories: ""
            command: |
              # NOT `&&`: a chain stops at the first red gate and HIDES every one after it.
              # check:focus-ring-paint was red for six consecutive nights on a stale assertion, and
              # the two gates behind it — measurement-contract-browser and state-legible — never ran
              # once. A gate that cannot run is a gate that does not exist, which is the same defect
              # gh#611/#615/#617 are all instances of. Run every gate, report every failure, fail once.
              #
              # Each gate is spelled out in full rather than looped over a list, because
              # check:gate-coverage scans these workflows for a literal `pnpm check:<name>` — and it
              # caught the first version of this block, which hid all eight behind a shell variable
              # and read as eight DEAD GATES. The wiring detector must be able to see the wiring.
              fail=0
              run() { echo "::group::$*"; if "$@"; then echo "PASS $*"; else echo "FAIL $*"; fail=1; fi; echo "::endgroup::"; }
              run pnpm check:data-entry-touch-aria
              run pnpm check:app-shell-narrow-grid
              run pnpm check:app-shell-page-width
              run pnpm check:choice-hit-target
              run pnpm check:data-table-empty-inset
              run pnpm check:number-input-step-target
              run pnpm check:focus-ring-paint
              run pnpm check:measurement-contract-browser
              run pnpm check:state-legible
              exit $fail
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      # No `preview:build` step: `frame-harness.ensurePreviewServer`, which these gates use,
      # have always done it. Building here too would just build twice.
      - run: ${{ matrix.command }}
        env:
          DATA_ENTRY_STORIES: ${{ matrix.stories }}
          # check-data-entry-frame-runtime reads PREVIEW_PORT; the other scripts keep their own.
          PREVIEW_PORT: ${{ matrix.port }}

  # ── The alarm this lane never had (gh#965) ──────────────────────────────────────────────────────
  # This lane was red on EVERY scheduled run from 2026-09-21 to 2026-09-26 — six nights, four jobs —
  # and nothing in the tracker knew. Its whole reason to exist is to catch what the per-merge lanes
  # cannot, so a red run nobody sees is the same as not running it. `godx-jp/id` solved exactly this
  # (id#1489 item 4, the job that keeps id#1797 open); this is that job, ported, lessons included.
  #
  # One issue, OPEN only while the lane is red: opened on the first red night, commented on every
  # red night after, closed by the first green one. So an open issue always means "red right now".
  #
  # Only on `schedule`. A `workflow_dispatch` or a `run-browser` PR label is someone looking on
  # purpose; it must not open or close the nightly alarm.
  nightly-alert:
    name: Report the nightly verdict
    needs: [geometry, token-wins, token-scope, control-glyph-tier, rendered-runtime]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: [self-hosted, swarm-pool]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the nightly alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does NOT check out. `gh` infers the repository from the git remote, so without a
          # `.git` its first call dies with "not a git repository", and under `set -e` the whole step
          # stops there — no issue, no comment, no close. That is how id's alarm went silent while its
          # lane stayed red; naming the repo here is the fix it paid for.
          GH_REPO: ${{ github.repository }}
          GEOMETRY: ${{ needs.geometry.result }}
          TOKEN_WINS: ${{ needs.token-wins.result }}
          TOKEN_SCOPE: ${{ needs.token-scope.result }}
          GLYPH_TIER: ${{ needs.control-glyph-tier.result }}
          RENDERED_RUNTIME: ${{ needs.rendered-runtime.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          title="[nightly] CI · browser (full sweep) đang đỏ"

          # A string, not an array: `set -u` on an older bash rejects expanding an EMPTY array, and
          # "nothing failed" is the case this branch sees most.
          failed=''
          [ "${GEOMETRY}" = 'success' ]         || failed="${failed}"$'\n'"- Viewport-matrix geometry sweep (${GEOMETRY})"
          [ "${TOKEN_WINS}" = 'success' ]       || failed="${failed}"$'\n'"- Inert component tokens (CDP cascade sweep) (${TOKEN_WINS})"
          [ "${TOKEN_SCOPE}" = 'success' ]      || failed="${failed}"$'\n'"- Unreachable tokens (scope + freeze sweep) (${TOKEN_SCOPE})"
          [ "${GLYPH_TIER}" = 'success' ]       || failed="${failed}"$'\n'"- Unsized control glyphs (icon-tier sweep) (${GLYPH_TIER})"
          [ "${RENDERED_RUNTIME}" = 'success' ] || failed="${failed}"$'\n'"- rendered-runtime, one or more shards (${RENDERED_RUNTIME})"

          # The LIST API, not `--search`: GitHub's search index lags by minutes, so an issue opened
          # last night can be invisible to a search tonight — and tonight would open a second one,
          # which is the one thing this job exists not to do.
          existing="$(gh issue list --state open --label ci --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | .[0].number // empty")"

          if [ -z "${failed}" ]; then
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "Làn đã XANH trở lại: ${RUN_URL}"$'\n\n'"Đóng lại. Một issue đang mở ở đây luôn có nghĩa là *ngay lúc này đang đỏ*."
              gh issue close "${existing}" --reason completed
              echo "Nightly lane green again; closed #${existing}."
            else
              echo 'Nightly lane green; nothing to report.'
            fi
            exit 0
          fi

          body="Lượt nightly đỏ: ${RUN_URL}"$'\n\n'"Job đỏ:${failed}"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Commented on #${existing}."
          else
            body="${body}"$'\n\n'"Mở tự động bởi job \`nightly-alert\` (gh#965). Nó comment thêm mỗi đêm còn đỏ, và tự đóng khi làn xanh trở lại."
            gh issue create --title "${title}" --label ci --label bug --body "${body}"
          fi

          # Red, so the run page says what the issue just said.
          exit 1
